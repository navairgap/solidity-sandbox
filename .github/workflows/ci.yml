name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  forge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run deterministic Solidity tests
        run: forge test -vvv
